<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSAFE Nepal - Earthquake Emergency Assistant</title>
    <!-- External CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Blurred Nature Background Overlay -->
    <div class="bg-overlay"></div>

    <!-- Main Floating Glass Terminal -->
    <div class="chat-wrapper">
        <header>
            <h1>QSAFE Nepal</h1>
            <div class="header-controls">
                <select id="lang-select">
                    <option value="en">EN</option>
                    <option value="ne">नेपाली</option>
                </select>
                
                <div id="telemetry-badge" class="badge online">
                    <span class="dot"></span>
                    <span id="telemetry-txt">Online</span>
                </div>
            </div>
        </header>

        <!-- LIVE USGS SEISMIC TELEMETRY BANNER -->
        <div id="seismic-banner" class="seismic-banner">
            <span class="seismic-icon">📡</span>
            <span id="seismic-txt">Checking live USGS seismic feed...</span>
        </div>

        <!-- Earthquake Focused Quick Chips (Bilingual Targetable) -->
        <div class="quick-chips">
            <button class="chip-btn" id="chip-eq" data-query="bhuikampa">🚨 Earthquake Protocol</button>
            <button class="chip-btn" id="chip-fa" data-query="first aid">🩹 First Aid</button>
            <button class="chip-btn" id="chip-kit" data-query="emergency kit">🎒 Emergency Kit</button>
        </div>

        <div class="chat-log" id="chat-log">
            <div class="bubble sys">
                Namaste. Initial interface framework initialized. Standing by for validation queries.
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="query-in" placeholder="Ask an emergency question..." autocomplete="off">
            <button id="dispatch-btn">Send</button>
        </div>
    </div>

    <!-- Inline script to toggle Quick Chip labels dynamically on language select -->
    <script>
        const langSelectUI = document.getElementById('lang-select');
        const chipEq = document.getElementById('chip-eq');
        const chipFa = document.getElementById('chip-fa');
        const chipKit = document.getElementById('chip-kit');

        if (langSelectUI) {
            langSelectUI.addEventListener('change', (e) => {
                const lang = e.target.value;
                if (lang === 'ne') {
                    chipEq.textContent = '🚨 भूकम्प निर्देशिका';
                    chipFa.textContent = '🩹 प्राथमिक उपचार';
                    chipKit.textContent = '🎒 आपतकालीन झोला';
                } else {
                    chipEq.textContent = '🚨 Earthquake Protocol';
                    chipFa.textContent = '🩹 First Aid';
                    chipKit.textContent = '🎒 Emergency Kit';
                }
            });
        }
    </script>
</body>
</html>
