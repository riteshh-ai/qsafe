<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSAFE Nepal - Prototype Terminal</title>
    <style>
        :root {
            --bg-canvas: #f3f4f6;
            --panel-bg: #ffffff;
            --primary-blue: #1e3a8a;
            --status-green: #10b981;
            --status-red: #ef4444;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-dark);
        }

        .chat-wrapper {
            width: 100%;
            max-width: 480px;
            height: 85vh;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Area */
        header {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .badge.online {
            background-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .badge.offline {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* Message Log Area */
        .chat-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .bubble.sys {
            background-color: #e5e7eb;
            color: var(--text-dark);
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .bubble.usr {
            background-color: var(--primary-blue);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .meta-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Bottom Input Deck */
        .input-bar {
            padding: 16px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .input-bar input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-bar input:focus {
            border-color: var(--primary-blue);
        }

        .input-bar button {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-bar button:hover {
            background-color: #1d4ed8;
        }
    </style>
    <script src="app.js" defer></script>
</head>
<body>

    <div class="chat-wrapper">
        <header>
            <h1>QSAFE Nepal</h1>
            <div id="telemetry-badge" class="badge online">
                <span class="dot"></span>
                <span id="telemetry-txt">Online</span>
            </div>
        </header>

        <div class="chat-log" id="chat-log">
            <div class="bubble sys">
                Namaste. Initial interface framework initialized. Standing by for validation queries.
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="query-in" placeholder="Ask an emergency question..." autocomplete="off">
            <button id="dispatch-btn">Send</button>
        </div>
    </div>

</body>
</html>
