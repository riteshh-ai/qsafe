<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSAFE Nepal - Earthquake Emergency Assistant</title>
    <!-- External CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js?v=3" defer charset="utf-8"></script>
</head>
<body>

    <!-- Blurred Nature Background Overlay -->
    <div class="bg-overlay"></div>

    <!-- Main Floating Glass Terminal -->
    <div class="chat-wrapper">
        <header>
            <h1>QSAFE Nepal</h1>
            <div class="header-controls">
                <select id="lang-select">
                    <option value="en">English (EN)</option>
                    <option value="ne_dev">नेपाली (Devanagari)</option>
                    <option value="ne_rom">Nepali (Romanized)</option>
                </select>
                
                <div id="telemetry-badge" class="badge online">
                    <span class="dot"></span>
                    <span id="telemetry-txt">Online</span>
                </div>
            </div>
        </header>

        <!-- LIVE USGS SEISMIC TELEMETRY BANNER -->
        <div id="seismic-banner" class="seismic-banner">
            <span class="seismic-icon">📡</span>
            <span id="seismic-txt">Checking live USGS seismic feed...</span>
        </div>

        <!-- Earthquake Focused Quick Chips (Bilingual Targetable) -->
        <div class="quick-chips">
            <button class="chip-btn" id="chip-eq" data-query="bhuikampa">🚨 Earthquake Protocol</button>
            <button class="chip-btn" id="chip-fa" data-query="first aid">🩹 First Aid</button>
            <button class="chip-btn" id="chip-kit" data-query="emergency kit">🎒 Emergency Kit</button>
        </div>

        <div class="chat-log" id="chat-log">
            <div class="bubble sys">
                Namaste! I am QSAFE Nepal, your AI Disaster & Emergency Safety Advisor. Ask about earthquake, first aid, or flood safety.
            </div>
        </div>
        
        <div class="input-bar">
            <input type="text" id="query-in" placeholder="Ask an emergency question..." autocomplete="off">
            <button id="dispatch-btn">Send</button>
        </div>
    </div>

    <!-- Inline script to toggle Quick Chip labels and placeholders dynamically on language select -->
    <script>
        const langSelectUI = document.getElementById('lang-select');
        const chipEq = document.getElementById('chip-eq');
        const chipFa = document.getElementById('chip-fa');
        const chipKit = document.getElementById('chip-kit');
        const queryInUI = document.getElementById('query-in');

        if (langSelectUI) {
            langSelectUI.addEventListener('change', (e) => {
                const lang = e.target.value;
                if (lang === 'ne_dev' || lang === 'ne') {
                    if (chipEq) { chipEq.textContent = '🚨 भूकम्प निर्देशिका'; chipEq.setAttribute('data-query', 'भूकम्प सुरक्षा'); }
                    if (chipFa) { chipFa.textContent = '🩹 प्राथमिक उपचार'; chipFa.setAttribute('data-query', 'प्राथमिक उपचार'); }
                    if (chipKit) { chipKit.textContent = '🎒 आपतकालीन झोला'; chipKit.setAttribute('data-query', 'आपतकालीन झोला'); }
                    if (queryInUI) queryInUI.placeholder = 'आपत्कालीन प्रश्न सोध्नुहोस्...';
                } else if (lang === 'ne_rom') {
                    if (chipEq) { chipEq.textContent = '🚨 Bhukampa Protocol'; chipEq.setAttribute('data-query', 'bhukampa bata bachna'); }
                    if (chipFa) { chipFa.textContent = '🩹 Prathamik Upachar'; chipFa.setAttribute('data-query', 'prathamik upachar'); }
                    if (chipKit) { chipKit.textContent = '🎒 Emergency Go-Bag'; chipKit.setAttribute('data-query', 'emergency kit jhola'); }
                    if (queryInUI) queryInUI.placeholder = 'Emergency prashna sodhnuhos...';
                } else {
                    if (chipEq) { chipEq.textContent = '🚨 Earthquake Protocol'; chipEq.setAttribute('data-query', 'earthquake safety'); }
                    if (chipFa) { chipFa.textContent = '🩹 First Aid'; chipFa.setAttribute('data-query', 'first aid guidance'); }
                    if (chipKit) { chipKit.textContent = '🎒 Emergency Kit'; chipKit.setAttribute('data-query', 'emergency kit checklist'); }
                    if (queryInUI) queryInUI.placeholder = 'Ask an emergency question...';
                }
            });
        }
    </script>
</body>
</html>
